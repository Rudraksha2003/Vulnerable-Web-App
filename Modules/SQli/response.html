<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Response | Hackers Arena</title>
    <link rel="stylesheet" href="../_shared/challenge.css">
    <style>
        .response-page pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            background: var(--ch-card);
            color: var(--ch-text);
            padding: 1.25rem;
            border: 1px solid var(--ch-border);
            border-radius: 8px;
            max-width: 640px;
            margin: 0 auto;
            overflow: auto;
            text-align: left;
            font-size: 0.9rem;
        }
        .response-page .back-link {
            max-width: 640px;
            margin: 0 auto 1rem;
            padding: 1.5rem 1.5rem 0;
        }
        .response-page header {
            max-width: 640px;
            margin: 0 auto;
            padding: 0 1.5rem 1rem;
        }
    </style>
</head>
<body class="response-page">
    <p class="back-link"><a href="challenge3.html">← Back to SQLi Challenge</a></p>
    <header>
        <h1>API Response</h1>
    </header>
    <div style="max-width: 640px; margin: 0 auto 2rem; padding: 0 1.5rem;">
        <pre id="response"></pre>
        <div id="flag-box" class="flag-box" style="display: none; margin-top: 1.5rem; padding: 1rem 1.25rem; background: rgba(34, 197, 94, 0.1); border: 1px solid var(--ch-border); border-radius: 8px;">
            <code id="flag-value" style="display: block; font-size: 1rem; font-weight: 600; color: var(--ch-accent); word-break: break-all;">FLAG{A05_SQLi_Bypass_Login}</code>
        </div>
    </div>
    <script>
        const apiResponse = localStorage.getItem('apiResponse');
        const responseElement = document.getElementById('response');
        const flagBox = document.getElementById('flag-box');
        if (apiResponse) {
            responseElement.textContent = apiResponse;
            try {
                const data = JSON.parse(apiResponse);
                if (data && data.success === true) {
                    flagBox.style.display = 'block';
                }
            } catch (e) {}
        } else {
            responseElement.textContent = "No response available.";
        }
    </script>
</body>
</html>
