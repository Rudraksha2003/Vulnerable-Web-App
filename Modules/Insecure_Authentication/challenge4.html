<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../_shared/challenge.css">
    <link rel="stylesheet" href="challenge4.css">
    <title>Insecure Authentication Challenge | Hackers Arena</title>
</head>
<body>
    <header>
        <p class="back-link"><a href="insecure_auth.html">← Back to Auth Module</a></p>
        <h1>Insecure Authentication Challenge</h1>
    </header>

    <div class="challenge-description">
        <p>Use the login form below to test for insecure authentication vulnerabilities.</p>
        <p>Think about how the application decides whether to grant access.</p>
    </div>

    <div class="login-container">
        <h2>Login</h2>
        <form id="login-form">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
        </form>

        <div id="response-section" class="response-section" style="display: none;">
            <label for="auth-response">Response:</label>
            <textarea id="auth-response" class="auth-response" rows="4"></textarea>
            <button type="button" id="proceed-btn" class="btn">Proceed</button>
        </div>
    </div>

    <script src="challenge4.js"></script>
</body>
</html>
