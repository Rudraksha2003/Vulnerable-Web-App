<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../_shared/challenge.css">
    <link rel="stylesheet" href="challenge4.css">
    <title>Authentication Failures (No Proxy) | Hackers Arena</title>
</head>
<body>
    <header>
        <p class="back-link"><a href="challenge4.html">← Back to Authentication Failures Challenge</a></p>
        <h1>Authentication Failures Challenge</h1>
    </header>

    <div class="challenge-description">
        <p>Same lab — response is shown below so you can try it without an interception tool.</p>
        <p>Use the login form, then try editing the response before clicking Proceed.</p>
    </div>

    <div class="login-container">
        <h2>Login</h2>
        <form id="login-form">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
        </form>

        <div id="response-section" class="response-section" style="display: none;">
            <label for="auth-response">Response (you can edit this):</label>
            <textarea id="auth-response" class="auth-response" rows="4"></textarea>
            <button type="button" id="proceed-btn" class="btn">Proceed</button>
        </div>
    </div>

    <script src="challenge4-no-proxy.js"></script>
</body>
</html>
